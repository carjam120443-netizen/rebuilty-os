name: Build Rebuilty OS ISO

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - i386
      x64_compat:
        description: Enable optional x64 compatibility components
        required: true
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

env:
  ROSBE_CI_DIR: ${{ github.workspace }}/third_party/reactos/RosBE-CI

jobs:
  build-iso:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Rebuilty OS
        uses: actions/checkout@v4

      - name: Install ReactOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git flex bison \
            gettext texinfo rsync wget ccache nasm \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 \
            g++-mingw-w64-x86-64 g++-mingw-w64-i686 \
            binutils-mingw-w64-x86-64 binutils-mingw-w64-i686 \
            p7zip-full python3

      - name: Fetch ReactOS
        run: |
          chmod +x scripts/fetch-reactos.sh
          ./scripts/fetch-reactos.sh

      - name: Configure using ReactOS RosBE-CI
        working-directory: third_party/reactos
        env:
          ROS_ARCH: ${{ inputs.arch || 'amd64' }}
        run: |
          if [ ! -f build_rosbe_ci.sh ]; then
            echo 'ReactOS build_rosbe_ci.sh was not found.'
            exit 1
          fi
          chmod +x build_rosbe_ci.sh
          ./build_rosbe_ci.sh "$ROSBE_CI_DIR"

      - name: Configure CMake build
        working-directory: third_party/reactos
        env:
          ARCH: ${{ inputs.arch || 'amd64' }}
        run: |
          BUILD_DIR="output-MinGW-${ARCH}"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Expected $BUILD_DIR was not created."
            find . -maxdepth 1 -type d -name 'output-*' -print
            exit 1
          fi
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Build ReactOS
        working-directory: third_party/reactos
        run: |
          ninja -C "$BUILD_DIR" -k0

      - name: Build bootable ISO
        working-directory: third_party/reactos
        run: |
          ninja -C "$BUILD_DIR" bootcd

      - name: Locate and prepare ISO
        working-directory: third_party/reactos
        run: |
          ISO=$(find "$BUILD_DIR" -type f -iname '*.iso' -print -quit)
          if [ -z "$ISO" ]; then
            echo 'No ISO was produced.'
            find "$BUILD_DIR" -type f | grep -Ei '\.(iso|img)$' || true
            exit 1
          fi
          cp "$ISO" "$GITHUB_WORKSPACE/RebuiltyOS.iso"
          file "$GITHUB_WORKSPACE/RebuiltyOS.iso"
          ls -lh "$GITHUB_WORKSPACE/RebuiltyOS.iso"

      - name: Upload Rebuilty OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltyOS-${{ inputs.arch || 'amd64' }}-ISO
          path: RebuiltyOS.iso
          if-no-files-found: error
          retention-days: 14
