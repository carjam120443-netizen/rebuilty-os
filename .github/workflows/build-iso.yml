name: Build Rebuilty OS ISO

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target architecture
        required: true
        default: amd64
        type: choice
        options:
          - amd64
          - i386
      x64_compat:
        description: Enable optional x64 compatibility components
        required: true
        default: false
        type: boolean
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    env:
      REBUILTY_X64_COMPAT: ${{ inputs.x64_compat || 'false' }}

    steps:
      - name: Checkout Rebuilty OS
        uses: actions/checkout@v4

      - name: Install ReactOS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git flex bison \
            gettext texinfo rsync wget ccache nasm \
            mingw-w64 \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix \
            binutils-mingw-w64-x86-64 binutils-mingw-w64-i686

      - name: Select POSIX MinGW toolchains
        run: |
          # Ubuntu also installs the Win32 MinGW variants. ReactOS builds an
          # amd64 GCC SEH plugin and the Win32 GCC 10 package exposes an
          # invalid plugin-version.h macro such as "10-win32". Use the POSIX
          # variants so GCCPLUGIN_VERSION_MINOR is a valid numeric value.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

          echo "amd64 GCC: $(x86_64-w64-mingw32-gcc --version | head -n1)"
          echo "amd64 plugin: $(x86_64-w64-mingw32-gcc --print-file-name=plugin)"
          echo "i386 GCC: $(i686-w64-mingw32-gcc --version | head -n1)"

      - name: Fetch ReactOS
        run: |
          chmod +x scripts/fetch-reactos.sh
          ./scripts/fetch-reactos.sh

      - name: Configure ReactOS
        working-directory: third_party/reactos
        env:
          ROS_ARCH: ${{ inputs.arch || 'amd64' }}
        run: |
          ./configure.sh

      - name: Locate ReactOS build directory
        id: builddir
        working-directory: third_party/reactos
        run: |
          BUILD_DIR="output-MinGW-${{ inputs.arch == 'i386' && 'i386' || 'amd64' }}"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Expected build directory $BUILD_DIR was not created."
            find . -maxdepth 1 -type d -name 'output-*' -print
            exit 1
          fi
          echo "path=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Build ReactOS host tools and targets
        working-directory: third_party/reactos
        run: |
          ninja -C "${{ steps.builddir.outputs.path }}"

      - name: Build bootable ISO
        working-directory: third_party/reactos
        run: |
          ninja -C "${{ steps.builddir.outputs.path }}" bootcd

      - name: Locate ISO
        id: iso
        working-directory: third_party/reactos
        run: |
          ISO=$(find "${{ steps.builddir.outputs.path }}" -type f -iname '*.iso' -print -quit)
          if [ -z "$ISO" ]; then
            echo 'No ISO was produced.'
            find "${{ steps.builddir.outputs.path }}" -type f | grep -Ei '\.(iso|img)$' || true
            exit 1
          fi
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Prepare Rebuilty ISO
        run: |
          cp "third_party/reactos/${{ steps.iso.outputs.path }}" RebuiltyOS.iso
          file RebuiltyOS.iso
          ls -lh RebuiltyOS.iso

      - name: Upload Rebuilty OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltyOS-${{ inputs.arch || 'amd64' }}-ISO
          path: RebuiltyOS.iso
          if-no-files-found: error
          retention-days: 14
